<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帳號管理 · AgenticService</title>
    <link href="./vendor/fontawesome-6.7.2/css/all.min.css" rel="stylesheet">
    <link href="./styles.css?v=2" rel="stylesheet">
</head>
<body>
    <main class="page">
        <div class="topbar">
            <div class="top-left">
                <a class="back-link" href="/main.html" aria-label="回到主畫面"><i class="fa-solid fa-arrow-left"></i> 回到主畫面</a>
                <div class="title-wrap">
                    <div class="main-tabs" role="tablist" aria-label="帳號與群組管理切換">
                        <button class="main-tab active" type="button" data-main-tab="accounts"><i class="fa-solid fa-users"></i> 帳號管理</button>
                        <button class="main-tab" type="button" data-main-tab="groups"><i class="fa-solid fa-layer-group"></i> 群組管理</button>
                        <button class="main-tab" type="button" data-main-tab="settings"><i class="fa-solid fa-gear"></i> 設定</button>
                    </div>
                </div>
            </div>
            <span class="status-pill" id="runtimeStatus"><i class="fa-solid fa-circle-notch fa-spin"></i> 檢查中</span>
            <script src="./runtime-status.js?v=1"></script>
        </div>

        <section class="workspace main-panel" data-main-panel="accounts">
            <aside class="panel">
                <div class="section-head">
                    <span class="list-heading">
                        <span>帳號列表</span>
                        <span class="subtitle" id="accountSummary">讀取帳號資料中</span>
                    </span>
                    <button class="icon primary" type="button" id="newAccountBtn" title="新增帳號" aria-label="新增帳號"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div class="account-tools">
                    <input id="accountSearch" placeholder="搜尋帳號、姓名、角色">
                    <button type="button" id="reloadBtn"><i class="fa-solid fa-rotate"></i> 重新整理</button>
                </div>
                <div class="account-list" id="accountList">
                    <div class="empty">尚無帳號資料</div>
                </div>
            </aside>

            <section class="panel">
                <div class="section-head">
                    <div class="tabs" role="tablist" aria-label="帳號內容切換">
                        <button class="tab active" type="button" data-tab="profile"><i class="fa-solid fa-id-card"></i> 帳號內容</button>
                        <button class="tab" type="button" data-tab="apiKeys"><i class="fa-solid fa-key"></i> 核發金鑰</button>
                    </div>
                    <label class="account-switch" id="selectedStatus">
                        <input id="enabled" type="checkbox">
                        <span class="switch-track" aria-hidden="true"></span>
                        <span class="switch-label" id="enabledSwitchLabel">啟用</span>
                    </label>
                </div>

                <div class="section-body">
                    <div class="tab-panel" data-tab-panel="profile">
                        <form id="accountForm">
                            <div class="form-grid">
                                <label>
                                    帳號 ID
                                    <input id="accountId" autocomplete="off">
                                </label>
                                <label>
                                    顯示名稱
                                    <input id="displayName" autocomplete="name">
                                </label>
                                <label>
                                    Email
                                    <input id="email" type="email" autocomplete="email">
                                </label>
                                <label>
                                    角色
                                    <select id="role">
                                        <option value="admin">admin</option>
                                        <option value="manager">manager</option>
                                        <option value="user">user</option>
                                        <option value="viewer">viewer</option>
                                    </select>
                                </label>
                                <div class="form-section">
                                    <label class="wide">
                                        所屬群組
                                        <div class="checkbox-list" id="groupIds"></div>
                                    </label>
                                </div>
                                <div class="password-row">
                                    <label>
                                        密碼
                                        <input id="password" type="password" autocomplete="new-password" placeholder="留空表示不變更">
                                    </label>
                                    <label>
                                        確認密碼
                                        <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="再次輸入密碼">
                                    </label>
                                </div>
                                <label class="wide">
                                    備註
                                    <textarea id="note" spellcheck="false" placeholder="輸入一般文字備註"></textarea>
                                </label>
                            </div>
                            <div class="form-actions">
                                <button type="button" class="danger" id="deleteBtn"><i class="fa-solid fa-trash"></i> 刪除</button>
                                <button type="submit" class="primary" id="saveAccountBtn"><i class="fa-solid fa-floppy-disk"></i> 儲存</button>
                            </div>
                        </form>
                    </div>

                    <div class="tab-panel" data-tab-panel="apiKeys" hidden>
                        <div class="api-key-panel">
                            <div class="api-key-issue">
                                <label>
                                    金鑰名稱
                                    <input id="apiKeyName" placeholder="例如 工廠排程遠端呼叫">
                                </label>
                                <button class="primary" type="button" id="issueApiKeyBtn"><i class="fa-solid fa-key"></i> 核發金鑰</button>
                            </div>
                            <div class="api-key-result" id="apiKeyResult" hidden>
                                <span class="api-key-result-title">請立即保存此金鑰，關閉後不會再次顯示。</span>
                                <div class="api-key-copy-row">
                                    <input id="apiKeyValue" readonly>
                                    <button type="button" id="copyApiKeyBtn"><i class="fa-solid fa-copy"></i> 複製</button>
                                </div>
                            </div>
                            <div class="api-key-list" id="apiKeyList">
                                <div class="empty">尚未核發金鑰</div>
                            </div>
                        </div>
                    </div>

                </div>
            </section>
        </section>

        <section class="workspace main-panel" data-main-panel="groups" hidden>
            <aside class="panel">
                <div class="section-head">
                    <span class="list-heading">
                        <span>群組列表</span>
                        <span class="subtitle" id="groupSummary">讀取群組資料中</span>
                    </span>
                    <button class="icon primary" type="button" id="newGroupBtn" title="新增群組" aria-label="新增群組"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div class="account-tools">
                    <input id="groupSearch" placeholder="搜尋群組、備註">
                    <button type="button" id="reloadGroupsBtn"><i class="fa-solid fa-rotate"></i> 重新整理</button>
                </div>
                <div class="account-list" id="groupList">
                    <div class="empty">尚無群組資料</div>
                </div>
            </aside>

            <section class="panel">
                <div class="section-head">
                    <div class="tabs" role="tablist" aria-label="群組內容切換">
                        <button class="tab active" type="button" data-group-tab="profile"><i class="fa-solid fa-layer-group"></i> 群組內容</button>
                        <button class="tab" type="button" data-group-tab="permissions"><i class="fa-solid fa-plug-circle-check"></i> 卡片權限</button>
                    </div>
                    <label class="account-switch" id="groupStatus">
                        <input id="groupEnabled" type="checkbox">
                        <span class="switch-track" aria-hidden="true"></span>
                        <span class="switch-label" id="groupEnabledLabel">啟用</span>
                    </label>
                </div>
                <div class="section-body">
                    <div class="tab-panel" data-group-tab-panel="profile">
                        <form id="groupForm">
                            <div class="form-grid">
                                <label>
                                    群組 ID
                                    <input id="groupId" autocomplete="off">
                                </label>
                                <label>
                                    群組名稱
                                    <input id="groupName" required>
                                </label>
                                <label class="wide">
                                    工作空間
                                    <div class="checkbox-list" id="groupWorkspaceIds"></div>
                                </label>
                                <label class="wide">
                                    備註
                                    <textarea id="groupNote" spellcheck="false" placeholder="輸入一般文字備註"></textarea>
                                </label>
                            </div>
                            <div class="form-actions">
                                <button type="button" class="danger" id="deleteGroupBtn"><i class="fa-solid fa-trash"></i> 刪除</button>
                                <button type="submit" class="primary"><i class="fa-solid fa-floppy-disk"></i> 儲存</button>
                            </div>
                        </form>
                    </div>
                    <div class="tab-panel" data-group-tab-panel="permissions" hidden>
                        <div class="permission-actions">
                            <button type="button" id="addPermissionBtn"><i class="fa-solid fa-plus"></i> 新增權限</button>
                            <button type="button" class="primary" id="savePermissionsBtn"><i class="fa-solid fa-floppy-disk"></i> 儲存權限</button>
                        </div>
                        <div class="permission-list" id="permissionList"></div>
                    </div>
                </div>
            </section>
        </section>

        <section class="main-panel settings-workspace" data-main-panel="settings" hidden>
            <section class="panel">
                <div class="section-head">
                    <span class="list-heading">
                        <span>系統設定</span>
                        <span class="subtitle">管理 Account Manager 對外提供的功能。</span>
                    </span>
                    <button class="icon" type="button" id="reloadSettingsBtn" title="重新整理設定" aria-label="重新整理設定">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                </div>
                <div class="section-body settings-page-body">
                    <section class="settings-section" aria-labelledby="mcpSettingsTitle">
                        <div class="settings-section-head">
                            <div class="settings-section-title">
                                <span class="settings-section-icon"><i class="fa-solid fa-network-wired"></i></span>
                                <span>
                                    <strong id="mcpSettingsTitle">MCP</strong>
                                    <span>控制 Account Manager 可提供給 AI Agent 的工具範圍，三項預設皆關閉。</span>
                                </span>
                            </div>
                            <span class="status-pill warn" id="mcpSettingsStatus"><i class="fa-solid fa-circle-pause"></i> 尚未載入</span>
                        </div>

                        <div class="mcp-setting-list">
                            <label class="mcp-setting-row" for="mcpReadEnabled">
                                <span class="mcp-setting-copy">
                                    <span class="mcp-setting-name"><i class="fa-solid fa-eye"></i> 讀取</span>
                                    <span>允許列出與查詢帳號、群組、權限，以及進行不修改資料的驗證。</span>
                                </span>
                                <span class="account-switch">
                                    <input id="mcpReadEnabled" type="checkbox" disabled>
                                    <span class="switch-track" aria-hidden="true"></span>
                                    <span class="switch-label" id="mcpReadEnabledLabel">關閉</span>
                                </span>
                            </label>
                            <label class="mcp-setting-row" for="mcpWriteEnabled">
                                <span class="mcp-setting-copy">
                                    <span class="mcp-setting-name"><i class="fa-solid fa-pen-to-square"></i> 寫入</span>
                                    <span>允許新增或更新帳號、密碼、群組及權限，不包含刪除。</span>
                                </span>
                                <span class="account-switch">
                                    <input id="mcpWriteEnabled" type="checkbox" disabled>
                                    <span class="switch-track" aria-hidden="true"></span>
                                    <span class="switch-label" id="mcpWriteEnabledLabel">關閉</span>
                                </span>
                            </label>
                            <label class="mcp-setting-row" for="mcpDeleteEnabled">
                                <span class="mcp-setting-copy">
                                    <span class="mcp-setting-name danger-text"><i class="fa-solid fa-trash-can"></i> 刪除</span>
                                    <span>允許刪除帳號或群組，與寫入權限分開控制。</span>
                                </span>
                                <span class="account-switch">
                                    <input id="mcpDeleteEnabled" type="checkbox" disabled>
                                    <span class="switch-track" aria-hidden="true"></span>
                                    <span class="switch-label" id="mcpDeleteEnabledLabel">關閉</span>
                                </span>
                            </label>
                        </div>
                    </section>
                    <div class="form-actions settings-actions">
                        <button type="button" class="primary" id="saveMCPSettingsBtn" disabled><i class="fa-solid fa-floppy-disk"></i> 儲存設定</button>
                    </div>
                </div>
            </section>
        </section>
    </main>

    <dialog class="settings-dialog" id="permissionSettingsDialog">
        <div class="settings-dialog-shell">
            <div class="settings-dialog-head">
                <div class="settings-dialog-title">
                    <strong id="permissionSettingsTitle">詳細設定</strong>
                    <span class="subtitle" id="permissionSettingsSummary">尚未選取卡片</span>
                </div>
                <button class="icon" type="button" id="closePermissionSettingsBtn" title="關閉" aria-label="關閉詳細設定">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="settings-grid" id="permissionSettingsList"></div>
            <div class="settings-dialog-actions">
                <button type="button" id="cancelPermissionSettingsBtn">取消</button>
                <button class="primary" type="button" id="savePermissionSettingsBtn"><i class="fa-solid fa-floppy-disk"></i> 套用設定</button>
            </div>
        </div>
    </dialog>

    <dialog class="settings-dialog boundary-dialog" id="accountBoundaryDialog" aria-labelledby="accountBoundaryTitle">
        <div class="settings-dialog-shell">
            <div class="settings-dialog-head">
                <div class="settings-dialog-title">
                    <strong id="accountBoundaryTitle">帳號權限邊界</strong>
                    <span class="subtitle" id="accountBoundarySummary">尚未選取帳號</span>
                </div>
                <button class="icon" type="button" id="closeAccountBoundaryBtn" title="關閉" aria-label="關閉帳號權限邊界">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="boundary-dialog-body" id="accountBoundaryBody"></div>
            <div class="settings-dialog-actions">
                <button class="primary" type="button" id="dismissAccountBoundaryBtn">關閉</button>
            </div>
        </div>
    </dialog>

    <dialog class="busy-dialog" id="busyDialog" aria-labelledby="busyDialogTitle">
        <div class="busy-dialog-shell">
            <i class="fa-solid fa-circle-notch busy-spinner" aria-hidden="true"></i>
            <strong id="busyDialogTitle">處理中</strong>
            <span id="busyDialogMessage">請稍候</span>
        </div>
    </dialog>

    <script src="/assets/js/api.js?v=4"></script>
    <script src="./app.js?v=2"></script>
</body>
</html>
